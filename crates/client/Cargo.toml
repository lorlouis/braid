[package]
name = "braid-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
unicode-width = { workspace = true }
braid-proto = { path = "../proto" }
braid-forward = { path = "../forward" }
braid-dgram = { path = "../dgram" }
rustix.workspace = true
getrandom.workspace = true
signal-hook.workspace = true
blake3.workspace = true
thiserror.workspace = true

# `IP_DONTFRAG`/`IPV6_DONTFRAG` are what refusing fragmentation is off Linux;
# rustix exposes neither.
[target.'cfg(not(target_os = "linux"))'.dependencies]
libc = "0.2"

[dev-dependencies]
braid-vt = { path = "../vt" }

[lints]
workspace = true
